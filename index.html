<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寒假工具集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            color: white;
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 18px;
        }

        .tools-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        .tool-card {
            background: white;
            border-radius: 20px;
            padding: 50px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }

        .tool-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .tool-card.schedule:hover {
            border: 3px solid #667eea;
        }

        .tool-card.reading:hover {
            border: 3px solid #4CAF50;
        }

        .tool-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: block;
        }

        .tool-card h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .tool-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .tool-arrow {
            font-size: 24px;
            color: #999;
            transition: all 0.3s;
        }

        .tool-card:hover .tool-arrow {
            transform: translateX(10px);
            color: #667eea;
        }

        .tool-card.schedule .tool-card:hover .tool-arrow {
            color: #667eea;
        }

        .tool-card.reading .tool-card:hover .tool-arrow {
            color: #4CAF50;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }

        @media screen and (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .tools-container {
                grid-template-columns: 1fr;
                padding: 0;
            }

            .tool-icon {
                font-size: 60px;
            }

            .tool-card h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎄 寒假工具集 🎄</h1>
            <p>高效规划寒假时光，轻松提升学习效率</p>
        </div>

        <div class="tools-container">
            <!-- 日程表工具 -->
            <a href="plan.html" class="tool-card schedule">
                <span class="tool-icon">📅</span>
                <h2>寒假每日任务日程表</h2>
                <p>管理每日任务，记录学习收获<br/>合理安排时间，养成良好习惯</p>
                <span class="tool-arrow">→</span>
            </a>

            <!-- 阅读题生成器工具 -->
            <a href="read.html" class="tool-card reading">
                <span class="tool-icon">📚</span>
                <h2>寒假阅读题生成器</h2>
                <p>导入阅读材料，生成阅读理解题<br/>智能创建题目，提升阅读能力</p>
                <span class="tool-arrow">→</span>
            </a>
        </div>

        <div class="footer">
            <p>© 2026 寒假学习助手 | 祝您学业进步！</p>
        </div>
    </div>
</body>
</html>
